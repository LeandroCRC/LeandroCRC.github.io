<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Autorización recibida</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
  code { display: block; word-break: break-all; padding: .75rem; background: #eee; border-radius: 6px; margin: 1rem 0; }
</style>
</head>
<body>
<h1>Autorización recibida</h1>
<p id="msg">Esperando datos…</p>
<code id="code"></code>
<p>Copiá el código de arriba y pegalo en tu script. Es de un solo uso. No lo compartas con nadie.</p>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const error = params.get('error');
  document.getElementById('msg').textContent = code
    ? 'Tu código de autorización:'
    : (error ? 'Mercado Libre devolvió un error: ' + error
             : 'Esta página muestra el código cuando autorizás la aplicación.');
  document.getElementById('code').textContent = code || '';
</script>
</body>
</html>
